name: look-back test
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated strategies to test (blank = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Replay last 7 and 14 days
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: python3 bot/backtest.py
      - name: Update dashboard
        if: always()
        run: python3 bot/report.py
      - name: Save results
        if: always()
        run: bash .github/save.sh "look-back test"

name: look-back test
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Replay last 7 and 14 days
        run: python3 bot/backtest.py
      - name: Update dashboard
        if: always()
        run: python3 bot/report.py
      - name: Save results
        if: always()
        run: bash .github/save.sh "look-back test"
